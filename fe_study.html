<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基本情報技術者試験 学習進捗＆タイマー</title>
  <style>
    /* --- 全体のデザイン設定（CSS） --- */
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary-color);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* --- タイマーのデザイン --- */
    .timer-box {
      text-align: center;
    }
    .timer-mode {
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 5px;
    }
    .timer-display {
      font-size: 3rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      margin: 10px 0;
    }
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }
    .btn:active { opacity: 0.8; }
    .btn-sub { background-color: #64748b; }
    .btn-danger {
      background-color: #ef4444;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    /* --- 進捗バーのデザイン --- */
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background-color: var(--border-color);
      border-radius: 9px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #10b981;
      transition: width 0.3s ease;
    }

    /* --- タスク追加フォーム --- */
    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }
    select, input[type="text"] {
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    /* --- タスクリストのデザイン --- */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .task-item:last-child { border-bottom: none; }
    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      color: white;
      white-space: nowrap;
    }
    .badge-tech { background-color: #2563eb; }
    .badge-mgmt { background-color: #d97706; }
    .badge-stra { background-color: #7c3aed; }
    .completed-text {
      text-decoration: line-through;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>基本情報技術者試験 学習管理</h1>

  <!-- ポモドーロタイマー -->
  <div class="card timer-box">
    <div id="timerMode" class="timer-mode">集中タイム（25分）</div>
    <div id="timerDisplay" class="timer-display">25:00</div>
    <div>
      <button class="btn" onclick="startTimer()">スタート</button>
      <button class="btn btn-sub" onclick="pauseTimer()">一時停止</button>
      <button class="btn btn-sub" onclick="resetTimer()">リセット</button>
      <button class="btn btn-sub" onclick="switchMode()">モード切替</button>
    </div>
  </div>

  <!-- 全体進捗 -->
  <div class="card">
    <div class="progress-header">
      <span>全体の達成率</span>
      <span id="progressText">0% (0 / 0)</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- タスク追加＆一覧 -->
  <div class="card">
    <div class="form-group">
      <select id="categorySelect">
        <option value="tech">テクノロジ系</option>
        <option value="mgmt">マネジメント系</option>
        <option value="stra">ストラテジ系</option>
      </select>
      <input type="text" id="taskInput" placeholder="例：アルゴリズム過去問5問">
      <button class="btn" onclick="addTask()">追加</button>
    </div>
    <div id="taskList"></div>
  </div>
</div>

<script>
  /* --- 調整可能な設定値（パラメータ） --- */
  const STUDY_MINUTES = 25; // 集中時間（分）
  const BREAK_MINUTES = 5;  // 休憩時間（分）
  const STORAGE_KEY = 'fe_exam_tasks_v1'; // ブラウザ保存用のキー名

  /* --- タイマーのプログラム --- */
  let isStudyMode = true;
  let remainingSeconds = STUDY_MINUTES * 60;
  let timerInterval = null;

  function updateTimerDisplay() {
    const mins = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
    const secs = String(remainingSeconds % 60).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
  }

  function startTimer() {
    if (timerInterval !== null) return;
    timerInterval = setInterval(() => {
      if (remainingSeconds > 0) {
        remainingSeconds--;
        updateTimerDisplay();
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
        alert(isStudyMode ? '集中タイム終了！5分休憩しましょう。' : '休憩終了！学習を再開しましょう。');
        switchMode();
      }
    }, 1000);
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer() {
    pauseTimer();
    remainingSeconds = (isStudyMode ? STUDY_MINUTES : BREAK_MINUTES) * 60;
    updateTimerDisplay();
  }

  function switchMode() {
    pauseTimer();
    isStudyMode = !isStudyMode;
    document.getElementById('timerMode').textContent = isStudyMode
      ? `集中タイム（${STUDY_MINUTES}分）`
      : `休憩タイム（${BREAK_MINUTES}分）`;
    remainingSeconds = (isStudyMode ? STUDY_MINUTES : BREAK_MINUTES) * 60;
    updateTimerDisplay();
  }

  /* --- タスク管理のプログラム --- */
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
    { id: 1, category: 'tech', text: '2進数と論理演算の復習', completed: false },
    { id: 2, category: 'mgmt', text: 'プロジェクトマネジメント用語の確認', completed: false },
    { id: 3, category: 'stra', text: '企業活動と法務の過去問を解く', completed: false }
  ];

  const categoryLabels = {
    tech: { name: 'テクノロジ', className: 'badge-tech' },
    mgmt: { name: 'マネジメント', className: 'badge-mgmt' },
    stra: { name: 'ストラテジ', className: 'badge-stra' }
  };

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const category = document.getElementById('categorySelect').value;
    const text = input.value.trim();
    if (!text) return;

    tasks.push({
      id: Date.now(),
      category: category,
      text: text,
      completed: false
    });
    input.value = '';
    saveTasks();
    renderTasks();
  }

  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id ? { ...task, completed: !task.completed } : task
    );
    saveTasks();
    renderTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
    renderTasks();
  }

  function renderTasks() {
    const listEl = document.getElementById('taskList');
    listEl.innerHTML = '';

    tasks.forEach(task => {
      const catInfo = categoryLabels[task.category];
      const item = document.createElement('div');
      item.className = 'task-item';
      item.innerHTML = `
        <div class="task-left">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
          <span class="badge ${catInfo.className}">${catInfo.name}</span>
          <span class="${task.completed ? 'completed-text' : ''}">${escapeHtml(task.text)}</span>
        </div>
        <button class="btn btn-danger" onclick="deleteTask(${task.id})">削除</button>
      `;
      listEl.appendChild(item);
    });

    // 進捗率の計算と更新
    const total = tasks.length;
    const completedCount = tasks.filter(t => t.completed).length;
    const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);

    document.getElementById('progressText').textContent = `${percent}% (${completedCount} / ${total})`;
    document.getElementById('progressFill').style.width = `${percent}%`;
  }

  // 安全に文字を表示するための処理
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // 初回表示の実行
  renderTasks();
</script>

</body>
</html>
